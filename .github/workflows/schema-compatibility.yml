name: Schema compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 2"

permissions:
  contents: read

concurrency:
  group: schema-compatibility
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.schema }} schema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        schema:
          - current
          - upcoming

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Generate transport
        env:
          SCHEMA_CHANNEL: ${{ matrix.schema }}
        run: ./tools/openapi/generate.sh "$SCHEMA_CHANNEL"

      - name: Compile transport and run stable contract tests
        run: ./gradlew :api-generated:compileKotlin :app:testDebugUnitTest --no-daemon --stacktrace
