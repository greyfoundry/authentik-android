name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify ASCII punctuation
        shell: bash
        run: |
          if git grep -nI -P '[\x{2013}\x{2014}]' -- .; then
            echo "Use an ASCII hyphen instead of an en or em dash."
            exit 1
          fi

      - name: Verify action pins
        run: python3 scripts/check_action_pins.py

      - name: Verify generated transport
        run: |
          ./tools/openapi/generate.sh current
          git diff --exit-code -- api-generated/src/main/kotlin

      - name: Build, test, and lint
        run: ./gradlew :api-generated:compileKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
